<p class="experience-status">
    <button type="button"
            class="button button-danger"
            popovertarget="delete-achievement-{{ achievement.id }}"
            aria-label="Delete {{ achievement.title }}"
            title="Delete achievement">
        Delete
    </button>
</p>
<div id="delete-achievement-{{ achievement.id }}"
    class="project-delete-modal"
    popover="auto"
    role="dialog"
    aria-modal="true"
    aria-labelledby="delete-achievement-title-{{ achievement.id }}">
    <button type="button"
            class="project-delete-modal__backdrop"
            popovertarget="delete-achievement-{{ achievement.id }}"
            popovertargetaction="hide"
            aria-label="Close delete confirmation"></button>
    <div class="project-delete-modal__content">
        <button type="button"
                class="project-delete-modal__close"
                popovertarget="delete-achievement-{{ achievement.id }}"
                popovertargetaction="hide"
                aria-label="Close delete confirmation">×</button>
        <h2 id="delete-achievement-title-{{ achievement.id }}">Delete this achievement?</h2>
        <p>
            Are you sure you want to delete
            <strong>{{ achievement.title }}</strong>?
        </p>
        <form method="post" action="{% url 'main:delete_achievement' achievement.id %}">
            {% csrf_token %}
            <div class="form-group">
                <label for="delete-password-{{ achievement.id }}">Secret Code</label>
                <input type="password"
                       name="password"
                       id="delete-password-{{ achievement.id }}"
                       placeholder="Enter secret code"
                       required>
            </div>
            <div class="project-delete-modal__actions">
                <button type="button"
                        class="button button-secondary"
                        popovertarget="delete-achievement-{{ achievement.id }}"
                        popovertargetaction="hide">Cancel</button>
                <button type="submit" class="button button-danger">Yes, delete this</button>
            </div>
        </form>
    </div>
</div>
